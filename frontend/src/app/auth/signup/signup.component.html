<div class="auth-container">
  <div class="auth-card">
    <h2>Create Account</h2>
    <form (submit)="register(); $event.preventDefault()">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" placeholder="Enter full name" [(ngModel)]="name" name="name" required />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Enter email" [(ngModel)]="email" name="email" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Enter password" [(ngModel)]="password" name="password" required />
      </div>

      <div class="form-group">
        <label>User Type</label>
        <select [(ngModel)]="userType" name="userType" required>
          <option value="Individual">Individual</option>
          <option value="Coaching">Coaching</option>
          <option value="School">School</option>
        </select>
      </div>

      <button class="btn-primary" type="submit">Create Account</button>
    </form>

    <p class="text-center">
      Already have an account? <a routerLink="/login">Login</a>
    </p>
  </div>
</div>
