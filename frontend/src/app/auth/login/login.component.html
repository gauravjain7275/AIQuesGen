<div class="auth-container">
  <div class="auth-card">
    <h2>Login</h2>
    <form (submit)="login(); $event.preventDefault()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" [(ngModel)]="email" name="email" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" [(ngModel)]="password" name="password" required />
      </div>

      <button class="btn-primary" type="submit">Login</button>
    </form>

    <p class="text-center">
      New user? <a routerLink="/signup">Create Account</a>
    </p>
  </div>
</div>
